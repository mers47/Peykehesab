name: Android Runtime Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '9.5.0'
  JAVA_VERSION: '17'

jobs:
  emulator-runtime-tests:
    name: Runtime API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 23
            sdk-level: '23'
          - api-level: 35
            sdk-level: '35'
          - api-level: 37
            sdk-level: '37.0'
    steps:
      - name: دریافت سورس
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: پنج ممیزی مستقل Production
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/static_audit.py
          python3 scripts/five_pass_audit.py

      - name: نصب JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: نصب Gradle ثابت
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: فعال‌سازی KVM
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: نصب SDK و ایمیج شبیه‌ساز
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          AVDMANAGER="$(command -v avdmanager || true)"
          if [[ -z "$AVDMANAGER" ]]; then AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"; fi
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "system-images;android-${{ matrix.sdk-level }};google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd \
            --force \
            --name "peykhesab-ci-${{ matrix.api-level }}" \
            --package "system-images;android-${{ matrix.sdk-level }};google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: اجرای شبیه‌ساز و انتظار برای Boot کامل
        shell: bash
        run: |
          set -Eeuo pipefail
          adb start-server
          "$ANDROID_HOME/emulator/emulator" \
            -avd "peykhesab-ci-${{ matrix.api-level }}" \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 4096 \
            > "$RUNNER_TEMP/emulator-${{ matrix.api-level }}.log" 2>&1 &
          adb wait-for-device
          for _ in {1..180}; do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb logcat -c
          adb shell input keyevent 82 >/dev/null 2>&1 || true

      - name: تست UI و یکپارچگی Room روی Debug
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: ایجاد کلید موقت و Build واقعی Release با R8
        shell: bash
        run: |
          set -Eeuo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storetype JKS \
            -storepass "ci-store-pass-2026" \
            -keypass "ci-key-pass-2026" \
            -alias "peykhesab-ci" \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=PeykHesab CI,O=CI,C=IR"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=ci-store-pass-2026"
            echo "ANDROID_KEY_ALIAS=peykhesab-ci"
            echo "ANDROID_KEY_PASSWORD=ci-key-pass-2026"
          } >> "$GITHUB_ENV"

      - name: Build و اعتبارسنجی APK Release
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -eq 1
          ./scripts/verify_apk.sh "${APKS[0]}" yes
          echo "RELEASE_APK=${APKS[0]}" >> "$GITHUB_ENV"

      - name: نصب و Launch واقعی Release
        shell: bash
        run: |
          set -Eeuo pipefail
          adb uninstall ir.peykhesab.app >/dev/null 2>&1 || true
          adb install -r "$RELEASE_APK"
          adb logcat -c
          adb shell am force-stop ir.peykhesab.app
          timeout 30s adb shell am start -W -n ir.peykhesab.app/.MainActivity | tee "$RUNNER_TEMP/release-launch-${{ matrix.api-level }}.txt"
          sleep 2
          adb shell ps | tr -d '\r' | grep -Eq '[[:space:]]ir\.peykhesab\.app$'
          timeout 20s adb shell uiautomator dump /sdcard/peykhesab.xml >/dev/null
          adb pull /sdcard/peykhesab.xml "$RUNNER_TEMP/peykhesab-${{ matrix.api-level }}.xml" >/dev/null
          grep -q 'پیک‌حساب' "$RUNNER_TEMP/peykhesab-${{ matrix.api-level }}.xml"
          adb exec-out screencap -p > "$RUNNER_TEMP/launch-${{ matrix.api-level }}.png"
          test -s "$RUNNER_TEMP/launch-${{ matrix.api-level }}.png"

      - name: تست چرخش و بازسازی Activity
        shell: bash
        run: |
          set -Eeuo pipefail
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 2
          adb shell ps | tr -d '\r' | grep -Eq '[[:space:]]ir\.peykhesab\.app$'
          timeout 20s adb shell uiautomator dump /sdcard/peykhesab-landscape.xml >/dev/null
          adb pull /sdcard/peykhesab-landscape.xml "$RUNNER_TEMP/peykhesab-landscape-${{ matrix.api-level }}.xml" >/dev/null
          grep -q 'پیک‌حساب' "$RUNNER_TEMP/peykhesab-landscape-${{ matrix.api-level }}.xml"
          adb exec-out screencap -p > "$RUNNER_TEMP/landscape-${{ matrix.api-level }}.png"
          test -s "$RUNNER_TEMP/landscape-${{ matrix.api-level }}.png"
          adb shell settings put system user_rotation 0
          adb shell settings put system accelerometer_rotation 1

      - name: بررسی نمایش بزرگ و Resize روی API جدید
        if: matrix.api-level == 37
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'adb shell wm size reset >/dev/null 2>&1 || true; adb shell wm density reset >/dev/null 2>&1 || true; adb shell settings put system font_scale 1.0 >/dev/null 2>&1 || true; adb shell cmd uimode night no >/dev/null 2>&1 || true' EXIT
          # 1600x1200 @ 200dpi => 800x600dp: actual large-screen threshold coverage.
          adb shell wm size 1600x1200
          adb shell wm density 200
          adb shell settings put system font_scale 2.0
          adb shell cmd uimode night yes
          adb shell am force-stop ir.peykhesab.app
          timeout 30s adb shell am start -W -n ir.peykhesab.app/.MainActivity >/dev/null
          sleep 2
          adb shell ps | tr -d '\r' | grep -Eq '[[:space:]]ir\.peykhesab\.app$'
          timeout 20s adb shell uiautomator dump /sdcard/peykhesab-large.xml >/dev/null
          adb pull /sdcard/peykhesab-large.xml "$RUNNER_TEMP/peykhesab-large.xml" >/dev/null
          grep -q 'پیک‌حساب' "$RUNNER_TEMP/peykhesab-large.xml"
          adb exec-out screencap -p > "$RUNNER_TEMP/large-api37.png"
          test -s "$RUNNER_TEMP/large-api37.png"

      - name: تست فشار Release و کنترل Crash و ANR
        shell: bash
        run: |
          set -Eeuo pipefail
          adb logcat -c
          set +e
          timeout 180s adb shell monkey \
            -p ir.peykhesab.app \
            --throttle 30 \
            --monitor-native-crashes \
            -v 1000 \
            2>&1 | tee "$RUNNER_TEMP/monkey-release-${{ matrix.api-level }}.log"
          MONKEY_STATUS=${PIPESTATUS[0]}
          set -e
          adb logcat -d > "$RUNNER_TEMP/logcat-release-${{ matrix.api-level }}.txt"
          if [[ "$MONKEY_STATUS" -ne 0 ]]; then
            echo "Monkey با وضعیت خطا پایان یافت: $MONKEY_STATUS" >&2
            exit 1
          fi
          if grep -Eqi '// CRASH|// ANR|CRASH: ir\.peykhesab\.app|ANR in ir\.peykhesab\.app' "$RUNNER_TEMP/monkey-release-${{ matrix.api-level }}.log"; then
            echo "Monkey خرابی یا ANR گزارش کرد" >&2
            exit 1
          fi
          if grep -Eq 'ANR in ir\.peykhesab\.app|Process: ir\.peykhesab\.app([[:space:]]|$)' "$RUNNER_TEMP/logcat-release-${{ matrix.api-level }}.txt"; then
            echo "Crash یا ANR مربوط به Release پیک‌حساب در Logcat پیدا شد" >&2
            exit 1
          fi
          adb shell ps | tr -d '\r' | grep -Eq '[[:space:]]ir\.peykhesab\.app$'

      - name: ثبت گواهی عبور Runtime این API
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "PRODUCTION_RUNTIME_GATE=PASS"
            echo "API_LEVEL=${{ matrix.api-level }}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sha256sum "$RELEASE_APK"
          } > "$RUNNER_TEMP/runtime-proof-${{ matrix.api-level }}.txt"

      - name: بارگذاری فقط گزارش‌های Runtime
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-api-${{ matrix.api-level }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator-${{ matrix.api-level }}.log
            ${{ runner.temp }}/release-launch-${{ matrix.api-level }}.txt
            ${{ runner.temp }}/monkey-release-${{ matrix.api-level }}.log
            ${{ runner.temp }}/logcat-release-${{ matrix.api-level }}.txt
            ${{ runner.temp }}/peykhesab-${{ matrix.api-level }}.xml
            ${{ runner.temp }}/peykhesab-landscape-${{ matrix.api-level }}.xml
            ${{ runner.temp }}/peykhesab-large.xml
            ${{ runner.temp }}/launch-${{ matrix.api-level }}.png
            ${{ runner.temp }}/landscape-${{ matrix.api-level }}.png
            ${{ runner.temp }}/large-api37.png
            ${{ runner.temp }}/runtime-proof-${{ matrix.api-level }}.txt
