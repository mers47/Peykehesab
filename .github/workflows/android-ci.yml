name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.5.0'
  JAVA_VERSION: '17'

jobs:
  build-and-static-checks:
    name: Build, unit tests, lint, R8
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: دریافت سورس
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: پنج ممیزی مستقل Production
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/static_audit.py
          python3 scripts/five_pass_audit.py

      - name: نصب JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: نصب Gradle ثابت
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: نصب Android SDK مورد نیاز
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: تست واحد، Lint، تحلیل R8 و Build کامل
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:analyzeReleaseR8Config \
            :app:assembleDebug \
            :app:assembleRelease

      - name: بررسی Schema واقعی Room
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t SCHEMAS < <(find app/schemas -type f -name '*.json' 2>/dev/null | sort)
          if [[ "${#SCHEMAS[@]}" -lt 1 ]]; then
            echo "Room Schema توسط Build تولید نشده است" >&2
            exit 1
          fi
          printf 'ROOM_SCHEMA_OK %s\n' "${SCHEMAS[@]}"

      - name: بررسی APK دیباگ
        shell: bash
        run: ./scripts/verify_apk.sh app/build/outputs/apk/debug/app-debug.apk yes

      - name: کنترل خروجی Release و R8
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f app/build/outputs/mapping/release/mapping.txt
          mapfile -t RELEASE_APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#RELEASE_APKS[@]}" -ne 1 ]]; then
            echo "خروجی Release باید دقیقاً یک APK یونیورسال باشد؛ تعداد: ${#RELEASE_APKS[@]}" >&2
            exit 1
          fi
          ./scripts/verify_apk.sh "${RELEASE_APKS[0]}" no

      - name: بارگذاری خروجی‌های Build
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-and-reports
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/mapping/release/
            app/build/reports/**/r8*/**/*


  runtime-gate:
    needs: build-and-static-checks
    name: Runtime gates
    uses: ./.github/workflows/android-runtime-gate.yml
