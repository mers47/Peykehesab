name: Build Signed Universal APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GRADLE_VERSION: '9.5.0'
  JAVA_VERSION: '17'

jobs:
  runtime-gate:
    name: Runtime release gate
    uses: ./.github/workflows/android-runtime-gate.yml

  signed-release:
    needs: runtime-gate
    name: Signed universal release
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: دریافت سورس
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: پنج ممیزی مستقل Production
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/static_audit.py
          python3 scripts/five_pass_audit.py

      - name: ثبت اثرانگشت سورس ورودی Release
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/peykhesab-source-proof"
          python3 scripts/source_manifest.py > "$RUNNER_TEMP/peykhesab-source-proof/SOURCE_MANIFEST.sha256"
          test -s "$RUNNER_TEMP/peykhesab-source-proof/SOURCE_MANIFEST.sha256"

      - name: نصب JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: نصب Gradle ثابت
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: نصب Android SDK مورد نیاز
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: اعتبارسنجی Secretهای امضای Release
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$KS_B64" || { echo "ANDROID_KEYSTORE_BASE64 تنظیم نشده" >&2; exit 1; }
          test -n "$KS_PASS" || { echo "ANDROID_KEYSTORE_PASSWORD تنظیم نشده" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS تنظیم نشده" >&2; exit 1; }
          test -n "$KEY_PASS" || { echo "ANDROID_KEY_PASSWORD تنظیم نشده" >&2; exit 1; }
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/peykhesab-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/peykhesab-release.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Build، تست و امضای Release
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/peykhesab-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace clean \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:analyzeReleaseR8Config \
            :app:assembleRelease

      - name: بررسی Schema واقعی Room
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t SCHEMAS < <(find app/schemas -type f -name '*.json' 2>/dev/null | sort)
          if [[ "${#SCHEMAS[@]}" -lt 1 ]]; then
            echo "Room Schema توسط Build تولید نشده است" >&2
            exit 1
          fi
          printf 'ROOM_SCHEMA_OK %s\n' "${SCHEMAS[@]}"

      - name: اعتبارسنجی یک APK یونیورسال و امضاشده
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f app/build/outputs/mapping/release/mapping.txt
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "خروجی باید دقیقاً یک APK باشد؛ تعداد: ${#APKS[@]}" >&2
            exit 1
          fi
          ./scripts/verify_apk.sh "${APKS[0]}" yes
          mkdir -p dist/proof
          VERSION="${GITHUB_REF_NAME:-manual}"
          FINAL_APK="dist/PeykHesab-universal-${VERSION}.apk"
          cp "${APKS[0]}" "$FINAL_APK"
          sha256sum "$FINAL_APK" > "dist/PeykHesab-universal-${VERSION}.sha256"
          python3 scripts/static_audit.py | tee dist/proof/static-audit.txt
          python3 scripts/five_pass_audit.py | tee dist/proof/five-pass-audit.txt
          cp "$RUNNER_TEMP/peykhesab-source-proof/SOURCE_MANIFEST.sha256" dist/proof/SOURCE_MANIFEST.sha256
          test -s dist/proof/SOURCE_MANIFEST.sha256
          cp app/build/outputs/mapping/release/mapping.txt dist/proof/r8-mapping.txt
          cp app/build/reports/lint-results-release.html dist/proof/lint-results-release.html
          mkdir -p dist/proof/room-schemas
          cp -a app/schemas/. dist/proof/room-schemas/
          cp -a app/build/test-results/testDebugUnitTest dist/proof/unit-test-results
          {
            echo "PEYKHESAB_PRODUCTION_RELEASE=PASS"
            echo "FIVE_PASS_AUDIT=PASS"
            echo "SOURCE_MANIFEST=YES"
            echo "VERSION=${VERSION}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "RUNTIME_GATE=PASS_API_23_35_36"
            echo "MIN_SDK=23"
            echo "TARGET_SDK=36"
            echo "R8_MINIFY=ENABLED"
            echo "RESOURCE_SHRINK=ENABLED"
            echo "SIGNED=YES"
            echo "UNIVERSAL_APK=YES"
            echo "ROOM_SCHEMA_GENERATED=YES"
            echo "ENCRYPTED_BACKUP_RUNTIME_TEST=PASS"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sha256sum "$FINAL_APK"
          } > dist/PRODUCTION_PROOF.txt
          (cd dist/proof && zip -qr ../PeykHesab-production-evidence-${VERSION}.zip .)
          test -s dist/PRODUCTION_PROOF.txt
          test -s "dist/PeykHesab-production-evidence-${VERSION}.zip"

      - name: ایجاد GitHub Artifact Attestation برای APK
        if: vars.ENABLE_GITHUB_ATTESTATION == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*.apk'

      - name: بارگذاری APK نهایی
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PeykHesab-signed-universal-apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/*.apk
            dist/*.sha256
            dist/PRODUCTION_PROOF.txt
            dist/*production-evidence*.zip
